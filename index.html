<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>iTech System</title>

<style>
body {
  margin: 0;
  background: black;
  color: #00ff99;
  font-family: monospace;
}

/* Matrix */
#matrix {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
}

/* 顶部 */
.top-label {
  position: fixed;
  top: 25px;
  width: 100%;
  text-align: center;
  font-size: 22px;
  letter-spacing: 5px;
}

/* 页面 */
.page {
  display: none;
  height: 100vh;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}
.active { display: flex; }

/* 🔥 主标题（大） */
.big-title {
  font-size: 90px;
  text-align: center;
}

/* 🔥 MISS IDA（美化版） */
.glitch {
  font-size: 110px;
  cursor: pointer;
  position: relative;
}

.glitch::before,
.glitch::after {
  content: attr(data-text);
  position: absolute;
  left: 0;
}

.glitch::before {
  color: red;
  animation: glitch1 1s infinite;
}

.glitch::after {
  color: blue;
  animation: glitch2 1s infinite;
}

@keyframes glitch1 {
  0% { left: 2px; }
  50% { left: -2px; }
  100% { left: 2px; }
}

@keyframes glitch2 {
  0% { left: -2px; }
  50% { left: 2px; }
  100% { left: -2px; }
}

/* 🔥 Batch 标题 */
.page-title {
  position: absolute;
  top: 120px;
  font-size: 45px;
}

/* 🔥 按钮（大） */
.btn {
  border: 2px solid #00ff99;
  padding: 18px 35px;
  margin: 15px;
  font-size: 24px;
  cursor: pointer;
}

.btn:hover {
  background: #00ff99;
  color: black;
}

/* Footer */
.footer-bar {
  position: fixed;
  bottom: 0;
  width: 100%;
  text-align: center;
  padding: 12px;
  border-top: 1px solid #00ff99;
}

.footer-text {
  font-size: 16px;
}

/* 🔥 Popup（大字） */
#popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: none;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.9);
}

.popup-box {
  border: 2px solid #00ff99;
  padding: 30px;
  width: 320px;
  background: black;
  font-size: 22px; /* 🔥 重点 */
}

.loading-bar {
  height: 5px;
  background: #00ff99;
  width: 0%;
  animation: load 1s forwards;
}

@keyframes load {
  to { width: 100%; }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>
<div class="top-label">iTech Club</div>

<!-- PAGE 1 -->
<div id="page1" class="page active">
  <div class="big-title">WELCOME</div>
  <div class="btn" onclick="goPage('page2')">ENTER</div>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">

  <!-- 🔥 美化 MISS IDA -->
  <div class="glitch"
       data-text="MISS IDA"
       onclick="showPopup('Miss Ida','1990-05-12')">
    MISS IDA
  </div>

  <div class="btn" onclick="goPage('batch1')">Batch 1</div>
  <div class="btn" onclick="goPage('batch2')">Batch 2</div>
  <div class="btn" onclick="goPage('batch3')">Batch 3</div>
</div>

<!-- Batch 1 -->
<div id="batch1" class="page">
  <div class="page-title">Batch 1</div>

  <div class="btn" onclick="showPopup('Shi Le','2005-07-12')">Shi Le</div>
</div>

<!-- Batch 2 -->
<div id="batch2" class="page">
  <div class="page-title">Batch 2</div>

  <div class="btn" onclick="showPopup('Syaa','2005-03-21')">Syaa</div>
</div>

<!-- Batch 3 -->
<div id="batch3" class="page">
  <div class="page-title">Batch 3</div>

  <div class="btn" onclick="showPopup('Student X','2007-02-02')">Student X</div>
</div>

<!-- POPUP -->
<div id="popup">
  <div class="popup-box">
    <div class="loading-bar"></div>
    <div id="popupText"></div>
    <div class="btn" onclick="closePopup()">CLOSE</div>
  </div>
</div>

<!-- FOOTER -->
<div class="footer-bar">
  <div class="btn" onclick="goBack()">← BACK</div>
  <div class="footer-text">© Happy Ng</div>
</div>

<script>

/* 页面 */
let historyStack = [];

function goPage(id) {
  const current = document.querySelector(".page.active");
  if (current) historyStack.push(current.id);

  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function goBack() {
  if (historyStack.length === 0) return;
  const last = historyStack.pop();

  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(last).classList.add("active");
}

/* popup */
function showPopup(name, birthday) {
  const popup = document.getElementById("popup");
  const textEl = document.getElementById("popupText");

  popup.style.display = "flex";
  textEl.innerText = "";

  let text = "Name: " + name + "\nBirthday: " + birthday;
  let i = 0;

  setTimeout(() => {
    function type() {
      if (i < text.length) {
        textEl.innerText += text.charAt(i);
        i++;
        setTimeout(type, 25);
      }
    }
    type();
  }, 500);
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
}

/* Matrix（数字） */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "0123456789";
const fontSize = 16;
const columns = canvas.width / fontSize;

const drops = [];
for (let i = 0; i < columns; i++) drops[i] = 1;

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#00ff99";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const text = letters[Math.floor(Math.random() * letters.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975)
      drops[i] = 0;

    drops[i]++;
  }
}

setInterval(draw, 33);

</script>

</body>
</html>
