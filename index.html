<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" 
content="width=device-width, 
initial-scale=1.0, viewport-fit=cover">
<title>iTech System</title>

<style>
body{
  margin:0;
  background:black;
  color:#00ff88;
  font-family:'Courier New', monospace;
  overflow:hidden;
}

/* 背景 */
#bg{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-1;
}

/* 页面 */
.page{
  display:none;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;

  /* 🔥 自动避开刘海 */
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

/* 标题 */
.intro-title{
  font-size:80px;
  margin-top:20px;
}

/* glitch */
.glitch{
  font-size:110px;
  animation:glitch 1s infinite;
}
@keyframes glitch{
  0%{text-shadow:3px 0 red,-3px 0 blue}
  50%{text-shadow:-3px 0 red,3px 0 blue}
  100%{text-shadow:none}
}

/* 按钮 */
button{
  padding:18px 40px;
  margin:10px;
  font-size:22px;
  background:black;
  border:2px solid #00ff88;
  color:#00ff88;
  cursor:pointer;
}
button:hover{
  background:#00ff88;
  color:black;
}

/* 卡片 */
.grid{
  display:grid;
  grid-template-columns:repeat(2,180px);
  gap:20px;
  margin-top:30px;
}
.card{
  border:2px solid #00ff88;
  padding:15px;
  font-size:22px;
  text-align:center;
  cursor:pointer;
}
.card:hover{
  background:#00ff88;
  color:black;
}

/* back */
.back-btn{
  margin-top:40px;
  margin-bottom:
env(safe-area-inset-bottom);
}

/* popup */
.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.9);
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}
.popup.active{
  opacity:1;
  pointer-events:auto;
}

.popup-box{
  border:2px solid #00ff88;
  padding:40px;
  width:320px;
  text-align:left;
  box-shadow:0 0 20px #00ff88;
}

/* scanning bar */
.bar{
  width:100%;
  height:10px;
  border:1px solid #00ff88;
  margin:10px 0;
}
#scan{
  height:100%;
  width:0;
  background:#00ff88;
}

#p-name{font-size:30px}
#p-birth{font-size:22px;margin-top:10px}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<!-- PAGE 1 -->
<div id="page1" class="page">
  <h1 class="intro-title">WELCOME TO iTECH CLUB</h1>
  <p style="font-size:28px">Tap anywhere</p>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
  <p style="font-size:30px">iTech Club LECTURER</p>
  <h1 class="glitch"
      onclick="showData('SITI FARIDAH BINTI SURATIN','20-06')">
      MISS IDA
  </h1>

  <button onclick="showPage('b1')">BATCH 1</button>
  <button onclick="showPage('b2')">BATCH 2</button>
  <button onclick="showPage('b3')">BATCH 3</button>
</div>

<!-- BATCH 1 -->
<div id="b1" class="page">
<h1 style="font-size:70px">BATCH 1</h1>

<div class="grid">
<div class="card" onclick="showData('NORFATINAH LUFFIAH BINTI MUHAMMAD FAIZAL','2007-09-12')">TEEYNA</div>
<div class="card" onclick="showData('KESHIKA A/P GANESH','2007-07-13')">Keshxjia</div>
<div class="card" onclick="showData('SIMON EDWIN A/L GOPALAN ','2007-09-02')">SIMON</div>
<div class="card" onclick="showData('YRISHIKESH A/L YUVARAJ','2007-10-11')">Rishi</div>
<div class="card" onclick="showData('SATHIARAJ A/L THANARAJ ','2007-05-14')">SATHYA</div>
<div class="card" onclick="showData('NG SHI LE','2007-07-15')">Happy Ng</div>
<div class="card" onclick="showData('SESHAKARAN ROSHAN A/L CHANDRA SEGAR ','2007-09-01')">S.KARAN.10</div>
<div class="card" onclick="showData('ZAHRA MARDHIYAH BINTI MOHAMMED AZAM','2006-08-17')">Dhea</div>
<div class="card" onclick="showData('VOO ZHENG LUN','2007-03-09')">Lun</div>
<div class="card" onclick="showData('MOHAMAD ZULHILMI BIN ZAHLAN SHAHRIN ','2006-05-20')">Fahmi</div>
</div>

<button class="back-btn" onclick="showPage('page2')">⬅ BACK</button>
</div>

<!-- BATCH 2 -->
<div id="b2" class="page">
<h1 style="font-size:70px">BATCH 2</h1>

<div class="grid">
<div class="card" onclick="showData('SANJEESWARAN','2007-12-16')">SANJEES•1716</div>
<div class="card" onclick="showData('TARKESHWARAN NAIR A/L ANANTHA KUMAR','2007-12-17')">Tarkesh</div>
<div class="card" onclick="showData('PAVITHREN A/L THIYAGOO','2007-10-09')">Pavithren</div>
<div class="card" onclick="showData('MUHAMMAD IZUWAN FIRDAUS BIN JAMALUDIN','2007-05-21')">Wan</div>
<div class="card" onclick="showData('PRAVEEN JEGANNATHAN','2007-10-19')">Praveen</div>
<div class="card" onclick="showData('ARAVIND RAJ A/L KANNAN THEVAR','2007-04-20')">Aravind</div>
<div class="card" onclick="showData('DHACAIYANI A/P PANNIR SELVAM','2007-07-19')">Dhaca</div>
</div>

<button class="back-btn" onclick="showPage('page2')">⬅ BACK</button>
</div>

<!-- BATCH 3 -->
<div id="b3" class="page">
<h1 style="font-size:70px">BATCH 3</h1>

<div class="grid">
<div class="card" onclick="showData('NURHAN HAZIQ BIN NAZAR','2003-03-03')">Nurhan</div>
<div class="card" onclick="showData('KRISHNA A/L KAYSAVAN','2007-06-07')">Krish</div>
<div class="card" onclick="showData('YUVANESH A/L VIVEKANATAN','2006-11-22')">Yuvanesh</div>
<div class="card" onclick="showData('YUGENDIRAN A/L JAKANDIRAN','2003-01-01')">Yugendiran</div>
</div>

<button class="back-btn" onclick="showPage('page2')">⬅ BACK</button>
</div>

<!-- POPUP -->
<div id="popup" class="popup">
  <div class="popup-box">
    <p id="status">Scanning...</p>

    <div class="bar">
      <div id="scan"></div>
    </div>

    <h2 id="p-name"></h2>
    <p id="p-birth"></p>

    <button onclick="closePopup()">CLOSE</button>
  </div>
</div>

<script>

/* 页面 */
function showPage(id){
 document.querySelectorAll(".page").forEach(p=>p.style.display="none");
 document.getElementById(id).style.display="flex";
}
showPage("page1");

/* 进入 */
document.addEventListener("click",()=>{
 if(getComputedStyle(page1).display!=="none"){
  showPage("page2");
 }
});

/* typing */
function typeText(el,text){
 el.textContent="";
 let i=0;
 function t(){
  if(i<=text.length){
   el.textContent=text.slice(0,i++);
   setTimeout(t,30);
  }
 }
 t();
}

/* scanning system */
function showData(name,birth){
 let popup=document.getElementById("popup");
 let scan=document.getElementById("scan");
 let status=document.getElementById("status");

 popup.classList.add("active");
 scan.style.width="0%";

 let p=0;
 let int=setInterval(()=>{
  p+=10;
  scan.style.width=p+"%";

  if(p>=100){
   clearInterval(int);
   status.textContent="Data Loaded";

   typeText(document.getElementById("p-name"),name);
   typeText(document.getElementById("p-birth"),"DOB: "+birth);
  }
 },100);
}

function closePopup(){
 document.getElementById("popup").classList.remove("active");
}

/* MATRIX 背景 */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const chars = "0123456789";
const fontSize = 16;
const columns = Math.floor(canvas.width / fontSize);

const drops = [];
for(let i=0;i<columns;i++){
 drops[i] = Math.random()*canvas.height;
}

function draw(){
 ctx.fillStyle = "rgba(0,0,0,0.08)";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 ctx.fillStyle = "#00ff88";
 ctx.font = fontSize + "px monospace";

 for(let i=0;i<drops.length;i++){
  const text = chars[Math.floor(Math.random()*chars.length)];
  ctx.fillText(text, i*fontSize, drops[i]);

  drops[i] += fontSize;

  if(drops[i] > canvas.height && Math.random() > 0.97){
    drops[i] = 0;
  }
 }

 requestAnimationFrame(draw);
}
draw();

window.addEventListener("resize",()=>{
 canvas.width = window.innerWidth;
 canvas.height = window.innerHeight;
});

</script>

</body>
</html>
