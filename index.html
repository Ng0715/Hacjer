<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>iTech System</title>

<style>
body{
  margin:0;
  background:black;
  color:#00ff88;
  font-family:monospace;
  overflow:hidden;
}

/* 页面 */
.page{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

/* Boot */
#boot{padding:30px}

/* 标题动画 */
.intro-title{
  font-size:70px;
  animation:zoom 1s forwards;
}
@keyframes zoom{
  from{opacity:0;transform:scale(0.6)}
  to{opacity:1;transform:scale(1)}
}

/* glitch */
.glitch-text{
  font-size:100px;
  animation:glitch 1s infinite;
}
@keyframes glitch{
  0%{text-shadow:2px 0 red,-2px 0 blue}
  50%{text-shadow:-2px 0 red,2px 0 blue}
  100%{text-shadow:none}
}

/* 按钮 */
button{
  padding:16px 30px;
  margin:10px;
  background:black;
  border:1px solid #00ff88;
  color:#00ff88;
  position:relative;
  overflow:hidden;
  font-size:16px;
}
button::after{
  content:"";
  position:absolute;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(120deg,transparent,#00ff88,transparent);
  transition:.5s;
}
button:hover::after{left:100%}

/* grid */
.grid{
  display:grid;
  grid-template-columns:repeat(3,120px);
  gap:15px;
  margin:20px;
}
.card{
  border:1px solid #00ff88;
  padding:10px;
  cursor:pointer;
  text-align:center;
}
.card:hover{
  background:#00ff88;
  color:black;
  transform:scale(1.05);
}

/* popup */
.popup{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,.8);
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}
.popup.active{opacity:1;pointer-events:auto}

.popup-box{
  border:1px solid #00ff88;
  padding:30px;
  background:black;
  transform:scale(.7);
  opacity:0;
}
.popup.active .popup-box{
  animation:popupIn .4s forwards,glitch .3s;
}
@keyframes popupIn{
  to{transform:scale(1);opacity:1}
}

/* progress */
.progress-bar{
  width:220px;height:10px;
  border:1px solid #00ff88;
  margin:10px auto;
}
#progress{
  height:100%;
  width:0;
  background:#00ff88;
}

/* 顶部标签 */
.top-label{
  position:absolute;
  top:20px;
  font-size:14px;
  opacity:.6;
  letter-spacing:2px;
}

/* footer */
footer{
  position:fixed;
  bottom:10px;
  width:100%;
  text-align:center;
  opacity:.5;
}
</style>
</head>

<body>

<div id="boot"></div>

<!-- PAGE 1 -->
<div id="page1" class="page">
  <h1 class="intro-title">WELCOME TO iTECH CLUB</h1>
  <p>Tap or Press ENTER</p>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
  <p>IT LECTURER</p>

  <h1 class="glitch-text"
      onclick="showLecturer(this)"
      data-name="Miss Ida"
      data-birth="1990-05-12">
      MISS IDA
  </h1>

  <button onclick="showPage('batch1')">BATCH 1</button>
  <button onclick="showPage('batch2')">BATCH 2</button>
  <button onclick="showPage('batch3')">BATCH 3</button>

  <button onclick="showPage('page1')">⬅ BACK</button>
</div>

<!-- BATCH 1 -->
<div id="batch1" class="page">
  <div class="top-label">FIRST BRAND</div>
  <h1>BATCH 1</h1>

  <div class="grid">
    <div class="card" onclick="showStudent(this)" data-name="Shi Le" data-birth="2005-07-12">Shi Le</div>
    <div class="card" onclick="showStudent(this)" data-name="Syaa" data-birth="2005-03-21">Syaa</div>
  </div>

  <button onclick="showPage('page2')">⬅ Back</button>
</div>

<!-- BATCH 2 -->
<div id="batch2" class="page">
  <div class="top-label">FIRST BRAND</div>
  <h1>BATCH 2</h1>

  <div class="grid">
    <div class="card" onclick="showStudent(this)" data-name="Student A" data-birth="2006-01-01">Student A</div>
  </div>

  <button onclick="showPage('page2')">⬅ Back</button>
</div>

<!-- BATCH 3 -->
<div id="batch3" class="page">
  <div class="top-label">FIRST BRAND</div>
  <h1>BATCH 3</h1>

  <div class="grid">
    <div class="card" onclick="showStudent(this)" data-name="Student B" data-birth="2007-02-02">Student B</div>
  </div>

  <button onclick="showPage('page2')">⬅ Back</button>
</div>

<!-- POPUP -->
<div id="popup" class="popup">
  <div class="popup-box">
    <p id="statusText"></p>

    <div class="progress-bar">
      <div id="progress"></div>
    </div>

    <h2 id="p-name"></h2>
    <p id="p-birth"></p>

    <button onclick="closePopup()">CLOSE</button>
  </div>
</div>

<footer>© Happy Ng</footer>

<script>

/* Boot */
let boot=document.getElementById("boot");
let lines=["Initializing system...","Loading modules...","Access Granted"];
let i=0;
function bootAnim(){
 if(i>=lines.length){
  boot.style.display="none";
  showPage("page1");
  return;
 }
 let d=document.createElement("div");
 d.innerText=lines[i++];
 boot.appendChild(d);
 setTimeout(bootAnim,600);
}
bootAnim();

/* Page */
function showPage(id){
 document.querySelectorAll(".page").forEach(p=>p.style.display="none");
 document.getElementById(id).style.display="flex";
}

/* Enter */
function enterSystem(){
 if(getComputedStyle(page1).display!=="none"){
  showPage("page2");
 }
}
document.addEventListener("click",enterSystem);
document.addEventListener("keydown",e=>{
 if(e.key==="Enter") enterSystem();
});

/* typing */
function typeText(el,text,s=30){
 el.textContent="";
 let i=0;
 function t(){
  if(i<=text.length){
   el.textContent=text.slice(0,i++);
   setTimeout(t,s);
  }
 }
 t();
}

/* 系统流程 */
function runSystem(name,birth,type){
 let popup=document.getElementById("popup");
 let status=document.getElementById("statusText");
 let bar=document.getElementById("progress");

 let nameEl=document.getElementById("p-name");
 let birthEl=document.getElementById("p-birth");

 popup.classList.add("active");
 bar.style.width="0%";
 nameEl.textContent="";
 birthEl.textContent="";

 status.textContent="Scanning "+type+" database...";

 let p=0;
 let int=setInterval(()=>{
  p+=Math.random()*20;
  bar.style.width=p+"%";

  if(p>=100){
   clearInterval(int);
   status.textContent="Accessing "+type+" record...";

   setTimeout(()=>{
    status.textContent="Data loaded";
    typeText(nameEl,name,40);
    typeText(birthEl,"Birthday: "+birth,25);
   },800);
  }

 },200);
}

/* student */
function showStudent(el){
 runSystem(el.dataset.name,el.dataset.birth,"student");
}

/* lecturer */
function showLecturer(el){
 runSystem(el.dataset.name,el.dataset.birth,"lecturer");
}

/* close */
function closePopup(){
 document.getElementById("popup").classList.remove("active");
}

</script>

</body>
</html>
