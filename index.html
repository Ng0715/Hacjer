<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>iTech Cinematic System</title>

<style>
body {
  margin: 0;
  background: black;
  color: #00ff88;
  font-family: monospace;
  overflow: hidden;
}

/* CRT 扫描线 */
body::after {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,0.2) 0px,
    rgba(0,0,0,0.2) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
}

/* 粒子背景 */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}

/* Boot */
#boot {
  padding: 40px;
  font-size: 18px;
  letter-spacing: 2px;
}

/* 页面 */
.page {
  display: none;
  text-align: center;
  padding-top: 100px;
}

/* 发光 */
.glow {
  text-shadow: 0 0 15px #00ff88;
}

/* 大标题 */
.big {
  font-size: 50px;
}

/* Footer */
footer {
  position: fixed;
  bottom: 10px;
  width: 100%;
  text-align: center;
  font-size: 12px;
  opacity: 0.5;
}

/* 按钮（SEM用） */
button {
  padding: 12px 25px;
  margin: 10px;
  background: black;
  color: #00ff88;
  border: 1px solid #00ff88;
  cursor: pointer;
}

button:hover {
  background: #00ff88;
  color: black;
  box-shadow: 0 0 10px #00ff88;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div id="boot"></div>

<!-- PAGE 1 -->
<div id="page1" class="page">
  <h1 class="big glow">WELCOME TO iTECH CLUB</h1>
  <p>Press ENTER or TAP anywhere to continue</p>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
  <h1 class="big glow">MISS IDA</h1>

  <button onclick="showPage('sem4')">SEM 4</button>
  <button onclick="showPage('sem3')">SEM 3</button>
  <button onclick="showPage('sem2')">SEM 2</button>
  <button onclick="showPage('sem1')">SEM 1</button>

  <br><br>
  <button onclick="showPage('page1')">⬅ BACK HOME</button>
</div>

<!-- SEM -->
<div id="sem4" class="page">
  <h1 class="glow">SEM 4</h1>
  <p>Shi Le</p>
  <button onclick="showPage('page2')">⬅ Back</button>
</div>

<div id="sem3" class="page">
  <h1 class="glow">SEM 3</h1>
  <p>Syaa</p>
  <button onclick="showPage('page2')">⬅ Back</button>
</div>

<div id="sem2" class="page">
  <h1 class="glow">SEM 2</h1>
  <p>Coming Soon</p>
  <button onclick="showPage('page2')">⬅ Back</button>
</div>

<div id="sem1" class="page">
  <h1 class="glow">SEM 1</h1>
  <p>Coming Soon</p>
  <button onclick="showPage('page2')">⬅ Back</button>
</div>

<footer>© Happy Ng</footer>

<script>
// 🎬 Boot Sequence
const boot = document.getElementById("boot");

const sequence = [
  "Initializing system...",
  "Loading secure modules...",
  "Establishing connection...",
  "Decrypting data...",
  "ACCESS GRANTED"
];

let i = 0;

function playBoot() {
  if (i >= sequence.length) {
    setTimeout(() => fadeOutBoot(), 1000);
    return;
  }

  let line = document.createElement("div");
  boot.appendChild(line);

  let text = sequence[i];
  let j = 0;

  function typeChar() {
    if (j < text.length) {
      line.innerHTML += text[j];
      j++;
      setTimeout(typeChar, 40);
    }
  }

  typeChar();
  i++;
  setTimeout(playBoot, 700);
}

function fadeOutBoot() {
  document.body.style.transition = "opacity 1s";
  document.body.style.opacity = "0";

  setTimeout(() => {
    boot.style.display = "none";
    document.body.style.opacity = "1";
    showPage("page1");
  }, 1000);
}

// 页面切换
function showPage(id) {
  document.querySelectorAll(".page").forEach(p => p.style.display = "none");
  document.getElementById(id).style.display = "block";
}

// 💥 点击进入（手机+电脑）
function enterSystem() {
  flashEffect(() => {
    showPage("page2");
  });
}

document.addEventListener("click", () => {
  if (document.getElementById("page1").style.display === "block") {
    enterSystem();
  }
});

// ⌨️ Enter 进入
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    if (document.getElementById("page1").style.display === "block") {
      enterSystem();
    }
  }
});

// 💥 闪屏效果
function flashEffect(callback) {
  const flash = document.createElement("div");

  flash.style.position = "fixed";
  flash.style.top = 0;
  flash.style.left = 0;
  flash.style.width = "100%";
  flash.style.height = "100%";
  flash.style.background = "#00ff88";
  flash.style.opacity = "0.8";
  flash.style.zIndex = "999";

  document.body.appendChild(flash);

  setTimeout(() => {
    flash.style.opacity = "0";
    setTimeout(() => {
      document.body.removeChild(flash);
      callback();
    }, 200);
  }, 100);
}

playBoot();

// 🌌 粒子背景
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 120; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2
  });
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "#00ff88";
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
  });
}

setInterval(draw, 30);
</script>

</body>
</html>
