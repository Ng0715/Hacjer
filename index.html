<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>iTech Cinematic System</title>

<style>
body {
  margin: 0;
  background: black;
  color: #00ff88;
  font-family: monospace;
  overflow: hidden;
}

/* CRT 扫描线 */
body::after {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,0.2) 0px,
    rgba(0,0,0,0.2) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
}

/* 页面布局 */
.page {
  display: none;
  height: 100vh;
  text-align: center;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

/* 标题动画 */
.intro-title {
  font-size: 70px;
  opacity: 0;
  transform: scale(0.6);
  animation: zoomIn 1s ease forwards;
}

@keyframes zoomIn {
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* MISS IDA glitch */
.glitch-text {
  font-size: 60px;
  animation: glitchText 1.5s infinite;
}

@keyframes glitchText {
  0% { text-shadow: 2px 0 red, -2px 0 blue; }
  50% { text-shadow: -2px 0 red, 2px 0 blue; }
  100% { text-shadow: none; }
}

/* 按钮扫描 */
button {
  padding: 12px 25px;
  margin: 15px;
  background: black;
  color: #00ff88;
  border: 1px solid #00ff88;
  position: relative;
  overflow: hidden;
}

button::after {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(0,255,136,0.4), transparent);
  transition: 0.5s;
}

button:hover::after {
  left: 100%;
}

/* fade + glitch */
.fade-out { opacity: 0; transition: 0.4s; }
.fade-in { opacity: 1; transition: 0.4s; }

.glitch {
  animation: glitch 0.3s;
}

@keyframes glitch {
  0% { transform: translate(0); }
  30% { transform: translate(-5px,5px); }
  60% { transform: translate(5px,-5px); }
  100% { transform: translate(0); }
}

/* Boot */
#boot {
  padding: 40px;
  font-size: 18px;
}

/* 粒子 */
canvas {
  position: fixed;
  z-index: -1;
}

/* footer */
footer {
  position: fixed;
  bottom: 10px;
  width: 100%;
  text-align: center;
  opacity: 0.5;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>
<div id="boot"></div>

<!-- PAGE 1 -->
<div id="page1" class="page">
  <h1 class="intro-title">WELCOME TO iTECH CLUB</h1>
  <p>Press ENTER or TAP anywhere</p>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
  <h1 class="glitch-text">MISS IDA</h1>

  <button onclick="showPage('sem4')">SEM 4</button>
  <button onclick="showPage('sem3')">SEM 3</button>
  <button onclick="showPage('sem2')">SEM 2</button>
  <button onclick="showPage('sem1')">SEM 1</button>

  <button onclick="showPage('page1')">⬅ BACK HOME</button>
</div>

<!-- SEM -->
<div id="sem4" class="page">
  <h1>SEM 4</h1>
  <p>Shi Le</p>
  <button onclick="showPage('page2')">⬅ Back</button>
</div>

<div id="sem3" class="page">
  <h1>SEM 3</h1>
  <p>Syaa</p>
  <button onclick="showPage('page2')">⬅ Back</button>
</div>

<div id="sem2" class="page">
  <h1>SEM 2</h1>
  <p>Coming Soon</p>
  <button onclick="showPage('page2')">⬅ Back</button>
</div>

<div id="sem1" class="page">
  <h1>SEM 1</h1>
  <p>Coming Soon</p>
  <button onclick="showPage('page2')">⬅ Back</button>
</div>

<footer>© Happy Ng</footer>

<script>
// 🎬 Boot
const lines = [
"Initializing system...",
"Loading modules...",
"Access Granted"
];

let i=0;
const boot=document.getElementById("boot");

function bootAnim(){
 if(i>=lines.length){
  setTimeout(()=>{boot.style.display="none";showPage("page1")},800);
  return;
 }
 let d=document.createElement("div");
 boot.appendChild(d);
 let t=lines[i],j=0;
 function type(){
  if(j<t.length){d.innerHTML+=t[j++];setTimeout(type,40);}
 }
 type();
 i++;
 setTimeout(bootAnim,600);
}
bootAnim();

// 页面切换（glitch+fade）
function showPage(id){
 const current=document.querySelector(".page[style*='flex']");
 if(current){
  current.classList.add("glitch","fade-out");
  setTimeout(()=>{
   current.style.display="none";
   current.classList.remove("glitch","fade-out");
   const next=document.getElementById(id);
   next.style.display="flex";
   next.classList.add("fade-in");
   setTimeout(()=>next.classList.remove("fade-in"),400);
  },300);
 }else{
  document.getElementById(id).style.display="flex";
 }
}

// 点击进入
function enterSystem(){
 const page1=document.getElementById("page1");
 if(window.getComputedStyle(page1).display==="none") return;
 flash(()=>showPage("page2"));
}

document.addEventListener("click",enterSystem);
document.addEventListener("touchstart",enterSystem);
document.addEventListener("keydown",e=>{
 if(e.key==="Enter") enterSystem();
});

// 闪屏
function flash(cb){
 const f=document.createElement("div");
 Object.assign(f.style,{
  position:"fixed",top:0,left:0,width:"100%",height:"100%",
  background:"#00ff88",opacity:"0.8",zIndex:999
 });
 document.body.appendChild(f);
 setTimeout(()=>{
  f.style.opacity="0";
  setTimeout(()=>{f.remove();cb();},200);
 },100);
}

// 粒子
const c=document.getElementById("bg"),ctx=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;
let p=[...Array(100)].map(()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*2}));
setInterval(()=>{
 ctx.clearRect(0,0,c.width,c.height);
 ctx.fillStyle="#00ff88";
 p.forEach(o=>{ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,6.28);ctx.fill();});
},30);
</script>

</body>
</html>
