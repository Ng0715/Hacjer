<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>iTech System</title>

<style>
body {
  margin: 0;
  background: black;
  color: #00ff99;
  font-family: monospace;
  overflow: hidden;
}

/* 🔥 Matrix 背景 */
#matrix {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
}

/* 🔥 顶部 iTech Club */
.top-label {
  position: fixed;
  top: 20px;
  width: 100%;
  text-align: center;
  font-size: 14px;
  letter-spacing: 3px;
  opacity: 0.7;
}

/* 页面 */
.page {
  display: none;
  text-align: center;
  height: 100vh;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.active {
  display: flex;
}

/* 标题 */
.big-title {
  font-size: 60px;
  margin-bottom: 20px;
}

/* Batch 标题（在上面） */
.page-title {
  position: absolute;
  top: 100px;
  width: 100%;
  text-align: center;
  font-size: 28px;
}

/* 按钮 */
.btn {
  border: 1px solid #00ff99;
  padding: 12px 25px;
  margin: 10px;
  cursor: pointer;
}

.btn:hover {
  background: #00ff99;
  color: black;
}

/* copyright */
.footer {
  position: fixed;
  bottom: 10px;
  width: 100%;
  text-align: center;
  font-size: 10px;
  opacity: 0.5;
}
</style>
</head>

<body>

<!-- 🔥 Matrix -->
<canvas id="matrix"></canvas>

<!-- 🔥 顶部 -->
<div class="top-label">iTech Club</div>

<!-- Page 1 -->
<div id="page1" class="page active">
  <div class="big-title">WELCOME TO iTECH CLUB</div>
  <div class="btn" onclick="goPage('page2')">ENTER</div>
</div>

<!-- Page 2 -->
<div id="page2" class="page">
  <div class="big-title">MISS IDA</div>

  <div class="btn" onclick="goPage('batch1')">Batch 1</div>
  <div class="btn" onclick="goPage('batch2')">Batch 2</div>
  <div class="btn" onclick="goPage('batch3')">Batch 3</div>

  <div class="btn" onclick="goPage('page1')">← Back</div>
</div>

<!-- Batch 1 -->
<div id="batch1" class="page">
  <div class="page-title">Batch 1</div>

  <div class="btn">Shi Le</div>
  <div class="btn">Student B</div>

  <div class="btn" onclick="goPage('page2')">← Back</div>
</div>

<!-- Batch 2 -->
<div id="batch2" class="page">
  <div class="page-title">Batch 2</div>

  <div class="btn">Syaa</div>

  <div class="btn" onclick="goPage('page2')">← Back</div>
</div>

<!-- Batch 3 -->
<div id="batch3" class="page">
  <div class="page-title">Batch 3</div>

  <div class="btn">Student X</div>

  <div class="btn" onclick="goPage('page2')">← Back</div>
</div>

<div class="footer">© Happy Ng</div>

<script>
function goPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* 🔥 Matrix 雨 */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01アイウエオカキクケコ";
const fontSize = 14;
const columns = canvas.width / fontSize;

const drops = [];
for (let x = 0; x < columns; x++) drops[x] = 1;

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#00ff99";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const text = letters[Math.floor(Math.random() * letters.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975)
      drops[i] = 0;

    drops[i]++;
  }
}

setInterval(draw, 33);
</script>

</body>
</html>
