<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>iTech System</title>

<style>
body{
  margin:0;
  background:black;
  color:#00ff88;
  font-family:'Courier New', monospace;
  overflow:hidden;
}

/* 背景 */
#bg{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-1;
}

/* 页面 */
.page{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

/* 标题 */
.intro-title{
  font-size:90px;
}

/* glitch */
.glitch{
  font-size:120px;
  animation:glitch 1s infinite;
}
@keyframes glitch{
  0%{text-shadow:3px 0 red,-3px 0 blue}
  50%{text-shadow:-3px 0 red,3px 0 blue}
  100%{text-shadow:none}
}

/* 按钮 */
button{
  padding:20px 40px;
  margin:15px;
  font-size:22px;
  background:black;
  border:2px solid #00ff88;
  color:#00ff88;
}

/* 卡片 */
.grid{
  display:grid;
  grid-template-columns:repeat(2,180px);
  gap:20px;
  margin-top:30px;
}
.card{
  border:2px solid #00ff88;
  padding:15px;
  font-size:22px;
  text-align:center;
  cursor:pointer;
}
.card:hover{
  background:#00ff88;
  color:black;
}

/* popup */
.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.9);
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}
.popup.active{
  opacity:1;
  pointer-events:auto;
}

.popup-box{
  border:2px solid #00ff88;
  padding:40px;
  width:300px;
  text-align:center;
  box-shadow:0 0 20px #00ff88;
}

#p-name{font-size:30px}
#p-birth{font-size:22px;margin-top:10px}

/* footer */
footer{
  position:fixed;
  bottom:10px;
  width:100%;
  text-align:center;
  font-size:14px;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<!-- PAGE 1 -->
<div id="page1" class="page">
  <h1 class="intro-title">WELCOME TO iTECH CLUB</h1>
  <p style="font-size:30px">Tap anywhere</p>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
  <p style="font-size:30px">IT LECTURER</p>

  <h1 class="glitch"
      onclick="showData('Miss Ida','1990-06-20')">
      MISS IDA
  </h1>

  <button onclick="showPage('b1')">BATCH 1</button>
  <button onclick="showPage('b2')">BATCH 2</button>
  <button onclick="showPage('b3')">BATCH 3</button>
</div>

<!-- BATCH 1 -->
<div id="b1" class="page">
<h1 style="font-size:80px">BATCH 1</h1>

<div class="grid">
<div class="card" onclick="showData('Teeyna','2007-09-12')">Teeyna</div>
<div class="card" onclick="showData('Keshika','2007-07-13')">Keshika</div>
<div class="card" onclick="showData('Simon','2007-09-02')">Simon</div>
<div class="card" onclick="showData('Rishi','2007-10-11')">Rishi</div>
<div class="card" onclick="showData('Sathya','2007-05-14')">Sathya</div>
<div class="card" onclick="showData('Shi Le','2005-07-12')">Shi Le</div>
<div class="card" onclick="showData('Karan','2007-09-01')">Karan</div>
<div class="card" onclick="showData('Dhea','2006-08-17')">Dhea</div>
<div class="card" onclick="showData('Lun','2007-03-09')">Lun</div>
<div class="card" onclick="showData('Fahmi','2006-05-20')">Fahmi</div>
</div>

</div>

<!-- BATCH 2 -->
<div id="b2" class="page">
<h1 style="font-size:80px">BATCH 2</h1>

<div class="grid">
<div class="card" onclick="showData('Sanjees','2007-12-16')">Sanjees</div>
<div class="card" onclick="showData('Tarkesh','2007-12-17')">Tarkesh</div>
<div class="card" onclick="showData('Pavithren','2007-10-09')">Pavithren</div>
<div class="card" onclick="showData('Izuwan','2007-05-21')">Izuwan</div>
<div class="card" onclick="showData('Praveen','2007-10-19')">Praveen</div>
<div class="card" onclick="showData('Aravind','2007-04-20')">Aravind</div>
<div class="card" onclick="showData('Dhaca','2007-07-19')">Dhaca</div>
</div>

</div>

<!-- BATCH 3 -->
<div id="b3" class="page">
<h1 style="font-size:80px">BATCH 3</h1>

<div class="grid">
<div class="card" onclick="showData('Nurhan','2003-03-03')">Nurhan</div>
<div class="card" onclick="showData('Krish','2007-06-07')">Krish</div>
<div class="card" onclick="showData('Yuvanesh','2006-11-22')">Yuvanesh</div>
<div class="card" onclick="showData('Yugendiran','2003-01-01')">Yugendiran</div>
</div>

</div>

<!-- POPUP -->
<div id="popup" class="popup">
  <div class="popup-box">
    <h2 id="p-name"></h2>
    <p id="p-birth"></p>
    <button onclick="closePopup()">CLOSE</button>
  </div>
</div>

<footer>
<button onclick="showPage('page2')">⬅ BACK</button><br>
© Happy Ng
</footer>

<script>

/* 页面 */
function showPage(id){
 document.querySelectorAll(".page").forEach(p=>p.style.display="none");
 document.getElementById(id).style.display="flex";
}
showPage("page1");

/* 进入 */
document.addEventListener("click",()=>{
 if(getComputedStyle(page1).display!=="none"){
  showPage("page2");
 }
});

/* popup */
function showData(name,birth){
 document.getElementById("popup").classList.add("active");

 typeText(document.getElementById("p-name"),name);
 typeText(document.getElementById("p-birth"),"Birthday: "+birth);
}

function closePopup(){
 document.getElementById("popup").classList.remove("active");
}

/* typing */
function typeText(el,text){
 el.textContent="";
 let i=0;
 function t(){
  if(i<=text.length){
   el.textContent=text.slice(0,i++);
   setTimeout(t,30);
  }
 }
 t();
}

/* 背景 */
const c=document.getElementById("bg");
const ctx=c.getContext("2d");

c.width=window.innerWidth;
c.height=window.innerHeight;

let dots=[];
for(let i=0;i<150;i++){
 dots.push({
  x:Math.random()*c.width,
  y:Math.random()*c.height
 });
}

function draw(){
 ctx.fillStyle="black";
 ctx.fillRect(0,0,c.width,c.height);

 ctx.fillStyle="#00ff88";
 dots.forEach(d=>{
  ctx.fillRect(d.x,d.y,2,2);
  d.y+=0.5;
  if(d.y>c.height)d.y=0;
 });

 requestAnimationFrame(draw);
}
draw();

</script>

</body>
</html>
